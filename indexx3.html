<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donation Overview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://us.123rf.com/450wm/artinspiring/artinspiring2409/artinspiring240901953/235838475-charity-volunteers-community-take-care-of-people-in-need-idea-of-care-and-humanity-humanitarian.jpg?ver=6');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      margin: 30px auto;
      padding: 30px;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      margin: 10px;
    }

    .button:hover {
      background-color: #45a049;
    }

    .box {
      background: #fff;
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: left;
    }

    .box p {
      margin: 10px 0;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    form {
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Thank You for Your Donation!</h1>
    <p>Your contribution is making a difference. We appreciate your generosity!</p>

    <!-- Donation Summary -->
    <div class="box">
      <h3>Donation Summary</h3>
      <p><strong>Amount:</strong> $<span id="donation-amount">0</span></p>
      <p><strong>Category:</strong> <span id="donation-category">None</span></p>
    </div>

    <!-- Payment Section -->
    <button class="button" onclick="document.getElementById('payment-section').classList.remove('hidden'); this.style.display='none'">Add Payment Details</button>

    <div id="payment-section" class="box hidden">
      <h3>Payment Details</h3>
      <form id="payment-form">
        <label>Cardholder Name:</label>
        <input type="text" id="card-name" required />

        <label>Card Number:</label>
        <input type="text" id="card-number" required />

        <label>Expiration Date:</label>
        <input type="month" id="expiration-date" required />

        <label>CVV:</label>
        <input type="text" id="cvv" required />

        <button type="submit" class="button">Submit Payment</button>
      </form>
    </div>

    <!-- View Details Section -->
    <button class="button" onclick="showDetails()">View Donation Details</button>

    <div id="details-section" class="box hidden">
      <h3>Your Full Donation & Payment Info</h3>
      <p><strong>Cardholder Name:</strong> <span id="view-card-name">-</span></p>
      <p><strong>Card Number:</strong> <span id="view-card-number">-</span></p>
      <p><strong>Expiration Date:</strong> <span id="view-expiration-date">-</span></p>
      <p><strong>CVV:</strong> <span id="view-cvv">-</span></p>
    </div>

    <!-- Connect with Personal AI -->
    <button class="button" onclick="window.location.href='map.html';">
      If you have some issues about delivery the click it.
    </button>
  </div>

  <script>
    // Load stored donation info
    const donationAmount = sessionStorage.getItem('donationAmount') || 'Not Available';
    const donationCategory = sessionStorage.getItem('donationCategory') || 'Not Available';
    document.getElementById('donation-amount').textContent = donationAmount;
    document.getElementById('donation-category').textContent = donationCategory;

    // Save payment info
    document.getElementById('payment-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const cardName = document.getElementById('card-name').value;
      const cardNumber = document.getElementById('card-number').value;
      const expirationDate = document.getElementById('expiration-date').value;
      const cvv = document.getElementById('cvv').value;

      // Save to sessionStorage
      sessionStorage.setItem('cardName', cardName);
      sessionStorage.setItem('cardNumber', cardNumber);
      sessionStorage.setItem('expirationDate', expirationDate);
      sessionStorage.setItem('cvv', cvv);

      alert('Payment submitted successfully!');
      document.getElementById('payment-section').classList.add('hidden');
    });

    // View saved payment details
    function showDetails() {
      document.getElementById('view-card-name').textContent = sessionStorage.getItem('cardName') || 'Not Available';
      document.getElementById('view-card-number').textContent = sessionStorage.getItem('cardNumber') || 'Not Available';
      document.getElementById('view-expiration-date').textContent = sessionStorage.getItem('expirationDate') || 'Not Available';
      document.getElementById('view-cvv').textContent = sessionStorage.getItem('cvv') || 'Not Available';

      document.getElementById('details-section').classList.remove('hidden');
    }
  </script>

</body>
</html>
