<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Donation Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-attachment: fixed;
      animation: bgMove 20s infinite linear;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    @keyframes bgMove {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* Navbar Styles */
    nav, .bottom-nav {
      width: 100%;
      padding: 15px 30px;
      background: linear-gradient(90deg, #4CAF50, #81C784); /* Green gradient */
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    nav {
      top: 0;
    }

    .bottom-nav {
      bottom: 0;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-size: 16px;
      transition: color 0.3s;
    }

    .nav-links a:hover,
    .bottom-nav a:hover {
      color: #f1f1f1;
      text-decoration: underline;
    }

    .bottom-nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .login-container {
      margin-top: 120px;
      margin-bottom: 100px;
      width: 90%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container h2 {
      color: #fff;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      color: #f1f1f1;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #333;
    }

    .input-group input:focus {
      outline: none;
      box-shadow: 0 0 8px #4CAF50;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .login-btn:hover {
      background-color: #388E3C;
      transform: scale(1.05);
    }

    .login-container p {
      margin-top: 15px;
      color: #ddd;
      font-size: 14px;
    }

    .login-container a {
      color: #AED581;
      text-decoration: none;
    }

    .login-container a:hover {
      text-decoration: underline;
    }

    /* Go to Next Button Style */
    .go-next-btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background-color: #388E3C;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .go-next-btn:hover {
      background-color: #2c6e2f;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .nav-links {
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav>
    <div class="nav-logo">Donation Connect</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">Login</a>
    </div>
  </nav>

  <!-- Login Container -->
  <div class="login-container">
    <h2>Login</h2>
    <form>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <p>Don't have an account? <a href="#">Sign up</a></p>

    <!-- Go to Next Button -->
    <button class="go-next-btn" onclick="window.location.href='index6.html'">Go to Next</button>
  </div>

  <!-- Bottom Navbar -->
  <div class="bottom-nav">
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
    <a href="#">Support</a>
  </div>

</body>
</html>
